<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Shooter HTML5</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            user-select: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            margin-top: -5px;
            margin-left: -5px;
            border-radius: 50%;
            background-color: rgba(0, 255, 0, 0.8);
            border: 1px solid rgba(0, 0, 0, 0.5);
            pointer-events: none;
            z-index: 10;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            pointer-events: none;
            z-index: 10;
            text-shadow: 2px 2px 4px #000;
        }
        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            cursor: pointer;
            z-index: 20;
            text-align: center;
        }
        #instructions h1 {
            margin-bottom: 10px;
            font-size: 40px;
            color: #ff9900;
        }
        #instructions p {
            margin: 5px 0;
            color: #ccc;
        }
    </style>
</head>
<body>

    <div id="crosshair"></div>
    <div id="ui">Счёт: <span id="score">0</span></div>
    <div id="instructions">
        <h1>Нажмите, чтобы начать</h1>
        <p><b>WASD</b> — Перемещение</p>
        <p><b>Мышь</b> — Обзор</p>
        <p><b>Левая кнопка мыши (ЛКМ)</b> — Стрельба</p>
    </div>

    <!-- Подключаем библиотеку Three.js для работы с 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        
        let yawObject, pitchObject;
        let targets = [];
        let score = 0;
        let weapon;

        const instructions = document.getElementById('instructions');

        function init() {
            // 1. Создание сцены и камеры
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee); // Цвет неба
            scene.fog = new THREE.Fog(0x7ec0ee, 10, 60);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            // Контроллер камеры для FPS
            pitchObject = new THREE.Object3D();
            pitchObject.add(camera);
            yawObject = new THREE.Object3D();
            yawObject.position.y = 1.7; // Высота глаз игрока
            yawObject.add(pitchObject);
            scene.add(yawObject);

            // 2. Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(30, 50, 20);
            scene.add(sunLight);

            // 3. Карта (Пол и блоки/укрытия)
            const floorGeo = new THREE.PlaneGeometry(80, 80);
            const floorMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Препятствия
            const boxGeo = new THREE.BoxGeometry(2, 2.5, 2);
            const boxMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
            for (let i = 0; i < 20; i++) {
                const box = new THREE.Mesh(boxGeo, boxMat);
                box.position.set(
                    (Math.random() - 0.5) * 50,
                    1.25,
                    (Math.random() - 0.5) * 50
                );
                scene.add(box);
            }

            // 4. Оружие
            const gunGeo = new THREE.BoxGeometry(0.12, 0.15, 0.6);
            const gunMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            weapon = new THREE.Mesh(gunGeo, gunMat);
            weapon.position.set(0.25, -0.2, -0.4);
            camera.add(weapon);

            // 5. Мишени
            spawnTargets();

            // 6. Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            setupEvents();
            animate();
        }

        function spawnTargets() {
            const targetGeo = new THREE.BoxGeometry(1.2, 2.2, 0.2);
            const targetMat = new THREE.MeshLambertMaterial({ color: 0xd9534f });

            for (let i = 0; i < 10; i++) {
                const target = new THREE.Mesh(targetGeo, targetMat);
                target.position.set(
                    (Math.random() - 0.5) * 40,
                    1.1,
                    -10 - Math.random() * 25
                );
                scene.add(target);
                targets.push(target);
            }
        }

        function shoot() {
            // Эффект отдачи оружия
            weapon.position.z += 0.08;
            setTimeout(() => weapon.position.z -= 0.08, 60);

            // Проверка попадания (Raycaster)
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            raycaster.setFromCamera(center, camera);

            const intersects = raycaster.intersectObjects(targets);

            if (intersects.length > 0) {
                const hitTarget = intersects[0].object;
                scene.remove(hitTarget);
                targets = targets.filter(t => t !== hitTarget);
                
                score += 100;
                document.getElementById('score').textContent = score;

                // Создание новой мишени через 1 секунду
                setTimeout(() => {
                    const targetGeo = new THREE.BoxGeometry(1.2, 2.2, 0.2);
                    const targetMat = new THREE.MeshLambertMaterial({ color: 0xd9534f });
                    const newTarget = new THREE.Mesh(targetGeo, targetMat);
                    newTarget.position.set(
                        (Math.random() - 0.5) * 40,
                        1.1,
                        -10 - Math.random() * 25
                    );
                    scene.add(newTarget);
                    targets.push(newTarget);
                }, 1000);
            }
        }

        function setupEvents() {
            instructions.addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                if (document.pointerLockElement === document.body) {
                    instructions.style.display = 'none';
                } else {
                    instructions.style.display = 'flex';
                }
            });

            document.addEventListener('mousemove', (e) => {
                if (document.pointerLockElement !== document.body) return;

                const movementX = e.movementX || 0;
                const movementY = e.movementY || 0;

                yawObject.rotation.y -= movementX * 0.002;
                pitchObject.rotation.x -= movementY * 0.002;

                pitchObject.rotation.x = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitchObject.rotation.x));
            });

            document.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = true; break;
                    case 'KeyS': moveBackward = true; break;
                    case 'KeyA': moveLeft = true; break;
                    case 'KeyD': moveRight = true; break;
                }
            });

            document.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': moveForward = false; break;
                    case 'KeyS': moveBackward = false; break;
                    case 'KeyA': moveLeft = false; break;
                    case 'KeyD': moveRight = false; break;
                }
            });

            document.addEventListener('mousedown', (e) => {
                if (document.pointerLockElement === document.body && e.button === 0) {
                    shoot();
                }
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = (time - prevTime) / 1000;

            if (document.pointerLockElement === document.body) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                const speed = 35.0;
                if (moveForward || moveBackward) velocity.z -= direction.z * speed * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * speed * delta;

                yawObject.translateX(-velocity.x * delta);
                yawObject.translateZ(velocity.z * delta);
            }

            prevTime = time;
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
